to and Swartwood decided that while this change would affect their students, everyone in the black belt ranks would maintain their current ranks and forego potential promotions themselves. Later, Masters Di Loreto and Swartwood replaced the concept and title of \"Master\" with the shogo titles, adopted from Japanese martial art systems. This incentivizes teaching accomplishments and furthering of Zen Martial Arts as a whole, and gives new meaning to the color red on belts at master levels."],

        function renderCurriculum() {
            const container = document.getElementById('curriculum-container');
            let html = '';

            curriculumData.forEach(section => {
                html += `
                    <section class="mb-10">
                        <h2 class="text-2xl font-bold text-white uppercase border-b border-neutral-800 pb-2 mb-6">${section.category}</h2>
                        <div class="space-y-3">
                `;

                section.belts.forEach(belt => {
                    html += `
                        <div class="bg-neutral-900 border border-neutral-800 rounded-lg overflow-hidden transition-all duration-200">
                            <button onclick="toggleReqs('${belt.id}')" class="w-full text-left px-4 py-3 flex items-center justify-between hover:bg-neutral-800 focus:outline-none group">
                                <div class="flex items-center">
                                    <div class="w-8 h-8 rounded border border-neutral-600 mr-4 shadow-inner ${belt.colorClass}"></div>
                                    <span class="font-bold uppercase tracking-wider text-sm sm:text-base text-neutral-300 group-hover:text-white">${belt.name}</span>
                                </div>
                                <i id="icon-${belt.id}" class="fas fa-chevron-down text-neutral-500 transition-transform duration-200"></i>
                            </button>
                            
                            <div id="reqs-${belt.id}" class="hidden bg-black p-6 border-t border-neutral-800">
                                ${buildRequirementsList(belt.reqs)}
                            </div>
                        </div>
                    `;
                });

                html += `</div></section>`;
            });

            container.innerHTML = html;
        }

        const labels = {
            info: "Information", general: "General Requirements", paper: "Paper", form: "Form", defense: "Self Defense", 
            strikes: "Strikes", blocks: "Blocks", kicks: "Kicks", stances: "Stances", sticks: "Sticks", staff: "Staff", 
            knife: "Knife", sparring: "Sparring", wing_chun: "Wing Chun", jujitsu: "Judo / Jujitsu", breaking: "Breaking"
        };

        function buildRequirementsList(reqs) {
            let html = '<div class="space-y-6">';
            
            for (const [key, items] of Object.entries(reqs)) {
                if (items && items.length > 0) {
                    html += `
                        <div>
                            <h4 class="text-accent font-bold uppercase tracking-wider text-sm mb-2"><i class="fas fa-caret-right mr-2"></i>${labels[key]}</h4>
                            <ul class="list-disc list-inside text-neutral-400 space-y-1 ml-2 text-sm md:text-base">
                    `;
                    items.forEach(item => {
                        const style = key === 'info' ? 'italic text-neutral-300' : '';
                        html += `<li class="${style}">${item}</li>`;
                    });
                    html += `</ul></div>`;
                }
            }
            
            html += '</div>';
            return html === '<div class="space-y-6"></div>' ? '<p class="text-neutral-500 italic text-sm">No specific requirements listed.</p>' : html;
        }

        function toggleReqs(id) {
            const reqContainer = document.getElementById(`reqs-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            
            if (reqContainer.classList.contains('hidden')) {
                reqContainer.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                reqContainer.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        document.addEventListener('DOMContentLoaded', renderCurriculum);
    </script>
