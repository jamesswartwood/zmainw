    <script>
        function checkLocalAuth() {
            if (window.location.protocol === 'file:') return true;
            try {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; zma_authenticated=`);
                if (parts.length === 2 && decodeURIComponent(parts.pop().split(';').shift()) === 'true') {
                    return true;
                }
            } catch (e) {
                return true;
            }

            const passwordAttempt = prompt("Please enter the password to view this page:");
            if (passwordAttempt === "humblewarrior") {
                try {
                    const expires = new Date(Date.now() + 30 * 864e5).toUTCString();
                    document.cookie = `zma_authenticated=true; expires=${expires}; path=/; SameSite=Lax`;
                } catch (e) {}
                return true;
            } else {
                alert("Access denied.");
                window.location.href = "index.html";
                return false;
            }
        }

        if (!checkLocalAuth()) {
            throw new Error("Access Denied");
        }

        const SHEET_ID = '1qV7CGWZPsgHc0nFAhf35vCicOPkueS7-CP4px_MtXV4';

        let parsedJrCols = [];
        let parsedElectivesData = null;

        function fetchSheetDataJSONP(tabName) {
            return new Promise((resolve) => {
                const callbackName = 'gvizCallback_' + Math.random().toString(36).substring(2, 9);
                const script = document.createElement('script');
                
                window[callbackName] = function(response) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    if (response && response.table && response.table.rows) {
                        resolve(response.table);
                    } else {
                        resolve(null);
                    }
                };

                script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${encodeURIComponent(tabName)}`;
                script.onerror = function() {
                    delete window[callbackName];
                    if (script.parentNode) document.body.removeChild(script);
                    resolve(null);
                };

                document.body.appendChild(script);
            });
        }

        const labels = {
            info: "Information", 
            general: "General Requirements", 
            papers: "Papers", 
            forms: "Forms", 
            weapons: "Weapons", 
            wing_chun: "Wing Chun", 
            sparring: "Sparring", 
            grappling: "Grappling", 
            self_defense: "Self Defense", 
            striking: "Striking", 
            tanren: "Tanren", 
            proficiency: "Proficiency",
            electives: "Electives"
        };

        function parseCurriculumTable(table) {
            if (!table || !table.rows || table.rows.length === 0) return [];

            const rows = table.rows;
            const numCols = table.cols ? table.cols.length : (rows[0]?.c?.length || 0);

            const columns = [];
            for (let c = 1; c < numCols; c++) {
                const levelVal = rows[0]?.c?.[c]?.v || '';
                const rankVal = rows[1]?.c?.[c]?.v || '';
                const colorVal = rows[2]?.c?.[c]?.v || '';

                if (!levelVal && !rankVal && !colorVal) continue;

                columns.push({
                    colIndex: c,
                    level: levelVal.toString().trim(),
                    rank: rankVal.toString().trim(),
                    color: colorVal.toString().trim(),
                    reqs: {}
                });
            }

            let currentCategory = '';

            for (let r = 3; r < rows.length; r++) {
                const col0Val = rows[r]?.c?.[0]?.v;
                if (col0Val !== null && col0Val !== undefined && col0Val.toString().trim() !== '') {
                    const rawCat = col0Val.toString().trim().toLowerCase();
                    
                    // Stop processing below the first Electives requirement row
                    if (['zma core', 'zmainw', 'and', 'verticals', 'belts worn'].includes(rawCat)) {
                        currentCategory = '';
                        continue;
                    }
                    if (rawCat === 'electives' && currentCategory === 'electives') {
                        // Encountered the electives notes/verticals header section below the table
                        break;
                    }
                    currentCategory = rawCat.replace(/\s+/g, '_');
                }

                if (!currentCategory) continue;

                columns.forEach(colObj => {
                    const c = colObj.colIndex;
                    const is10thKyu = colObj.rank.includes('10th') && !colObj.rank.includes('High');

                    // 10th Kyu stops after 'General'
                    if (is10thKyu && !['info', 'general'].includes(currentCategory)) {
                        return;
                    }

                    const cellVal = rows[r]?.c?.[c]?.v;
                    if (cellVal !== null && cellVal !== undefined && cellVal.toString().trim() !== '') {
                        const str = cellVal.toString().trim();
                        if (!['notes:', 'none', '-'].includes(str.toLowerCase())) {
                            if (!colObj.reqs[currentCategory]) {
                                colObj.reqs[currentCategory] = [];
                            }
                            colObj.reqs[currentCategory].push(str);
                        }
                    }
                });
            }

            return columns;
        }

        function parseElectivesAndVerticals(table) {
            if (!table || !table.rows) return getFallbackElectives();

            try {
                const rows = table.rows;

                // Extract Elective Categories (Columns 4 to 10)
                const electiveCategories = [];
                for (let c = 4; c <= 10; c++) {
                    const catTitle = rows[52]?.c?.[c]?.v?.toString().trim();
                    if (!catTitle) continue;
                    const items = [];
                    for (let r = 53; r <= 59; r++) {
                        const val = rows[r]?.c?.[c]?.v;
                        if (val && val.toString().trim()) {
                            items.push(val.toString().trim());
                        }
                    }
                    electiveCategories.push({ title: catTitle, items });
                }

                // Extract Verticals Categories (Columns 13 to 15)
                const verticalCategories = [];
                for (let c = 13; c <= 15; c++) {
                    const catTitle = rows[52]?.c?.[c]?.v?.toString().trim();
                    if (!catTitle) continue;
                    const items = [];
                    for (let r = 53; r <= 59; r++) {
                        const val = rows[r]?.c?.[c]?.v;
                        if (val && val.toString().trim()) {
                            items.push(val.toString().trim());
                        }
                    }
                    verticalCategories.push({ title: catTitle, items });
                }

                return {
                    electiveCategories: electiveCategories.length > 0 ? electiveCategories : getFallbackElectives().electiveCategories,
                    verticalCategories: verticalCategories.length > 0 ? verticalCategories : getFallbackElectives().verticalCategories
                };
            } catch (err) {
                console.warn("Using fallback electives parsing", err);
                return getFallbackElectives();
            }
        }

        function getBeltColorClass(colorName, rankName) {
            const c = (colorName || rankName || '').toLowerCase();
            if (c.includes('yellow w/ white')) return "bg-[#fff94f] text-black bg-[linear-gradient(90deg,transparent_45%,white_45%,white_55%,transparent_55%)]";
            if (c.includes('orange w/ white')) return "bg-[#ffbb0f] text-black bg-[linear-gradient(90deg,transparent_45%,white_45%,white_55%,transparent_55%)]";
            if (c.includes('blue w/ white')) return "bg-[#0fabff] text-black bg-[linear-gradient(90deg,transparent_45%,white_45%,white_55%,transparent_55%)]";
            if (c.includes('purple w/ white')) return "bg-[#eb0fff] text-white bg-[linear-gradient(90deg,transparent_45%,white_45%,white_55%,transparent_55%)]";
            if (c.includes('green w/ white')) return "bg-[#02ef3d] text-black bg-[linear-gradient(90deg,transparent_45%,white_45%,white_55%,transparent_55%)]";
            if (c.includes('brown w/ white')) return "bg-[#efb267] text-black bg-[linear-gradient(90deg,transparent_45%,white_45%,white_55%,transparent_55%)]";
            if (c.includes('red w/ white')) return "bg-[#ff3f3f] text-white bg-[linear-gradient(90deg,transparent_45%,white_45%,white_55%,transparent_55%)]";
            if (c.includes('black w/ white')) return "bg-black text-white bg-[linear-gradient(90deg,transparent_45%,white_45%,white_55%,transparent_55%)] border border-neutral-700";
            if (c.includes('yellow')) return "bg-[#fff94f] text-black";
            if (c.includes('orange')) return "bg-[#ffbb0f] text-black";
            if (c.includes('blue')) return "bg-[#0fabff] text-black";
            if (c.includes('purple')) return "bg-[#eb0fff] text-white";
            if (c.includes('green')) return "bg-[#02ef3d] text-black";
            if (c.includes('brown')) return "bg-[#efb267] text-black";
            if (c.includes('coral') || c.includes('red-black')) return "bg-[repeating-linear-gradient(45deg,#000,#000_6px,#b91c1c_6px,#b91c1c_12px)] text-white";
            if (c.includes('red-white') || c.includes('red w/ white')) return "bg-[repeating-linear-gradient(45deg,#fff,#fff_6px,#b91c1c_6px,#b91c1c_12px)] text-black";
            if (c.includes('red')) return "bg-[#ff3f3f] text-white";
            if (c.includes('black')) return "bg-black text-white border border-neutral-700";
            return "bg-white text-black";
        }

        async function initCurriculum() {
            try {
                const [zmaTable, jrTable] = await Promise.all([
                    fetchSheetDataJSONP('ZMAINW Curriculum'),
                    fetchSheetDataJSONP('Junior Curriculum')
                ]);

                if (zmaTable && zmaTable.rows) {
                    parsedZmaCols = parseCurriculumTable(zmaTable);
                    parsedElectivesData = parseElectivesAndVerticals(zmaTable);
                } else {
                    parsedElectivesData = getFallbackElectives();
                }

                if (jrTable && jrTable.rows) {
                    parsedJrCols = parseCurriculumTable(jrTable);
                }

                renderAllSections();
            } catch (err) {
                console.warn("Dynamic fetch encountered issue; rendering baseline curriculum view.", err);
                parsedElectivesData = getFallbackElectives();
                renderAllSections();
            }
        }

        function mergeRequirements(...reqObjects) {
            const res = {};
            reqObjects.forEach(obj => {
                if (!obj) return;
                for (const [cat, list] of Object.entries(obj)) {
                    if (!res[cat]) res[cat] = [];
                    if (Array.isArray(list)) {
                        list.forEach(item => {
                            if (!res[cat].includes(item)) res[cat].push(item);
                        });
                    }
                }
            });
            return res;
        }

        function switchStudentTab(tabKey) {
            activeStudentTab = tabKey;
            ['standard', 'junior', 'milestone'].forEach(k => {
                const btn = document.getElementById(`tab-btn-${k}`);
                if (k === tabKey) {
                    btn.className = "px-4 sm:px-6 py-2 rounded-lg text-xs sm:text-sm font-bold uppercase tracking-wider transition-all bg-white text-black shadow";
                } else {
                    btn.className = "px-4 sm:px-6 py-2 rounded-lg text-xs sm:text-sm font-bold uppercase tracking-wider transition-all text-neutral-400 hover:text-white";
                }
            });
            renderAllSections();
        }

        function renderDanRanksCombinedAccordion(parsedCols) {
            // Extract columns for Nidan, Sandan, and Yondan (Tests 1, 2, and 3)
            const test1Col = parsedCols.find(c => c.rank.toLowerCase().includes('nidan') || c.rank.toLowerCase().includes('2nd dan'));
            const test2Col = parsedCols.find(c => c.rank.toLowerCase().includes('sandan') || c.rank.toLowerCase().includes('3rd dan'));
            const test3Col = parsedCols.find(c => c.rank.toLowerCase().includes('yondan') || c.rank.toLowerCase().includes('4th dan'));

            const testRanks = [
                { label: "1st Test (Nidan / 2nd Dan)", col: test1Col },
                { label: "2nd Test (Sandan / 3rd Dan)", col: test2Col },
                { label: "3rd Test (Yondan / 4th Dan)", col: test3Col }
            ];

            const getTestSpecificReqs = (col) => {
                if (!col || !col.reqs) return {};
                const filtered = {};
                for (const [key, items] of Object.entries(col.reqs)) {
                    if (key !== 'info' && key !== 'general') {
                        filtered[key] = items;
                    }
                }
                return filtered;
            };

            // Extract Nidan through Kudan (2nd Dan to 9th Dan)
            const danRanksGeneral = parsedCols.filter(c => {
                const r = c.rank.toLowerCase();
                return r.includes('nidan') || r.includes('2nd dan') ||
                       r.includes('sandan') || r.includes('3rd dan') ||
                       r.includes('yondan') || r.includes('4th dan') ||
                       r.includes('godan') || r.includes('5th dan') ||
                       r.includes('rokudan') || r.includes('6th dan') ||
                       r.includes('shichidan') || r.includes('nanadan') || r.includes('7th dan') ||
                       r.includes('hachidan') || r.includes('8th dan') ||
                       r.includes('kudan') || r.includes('9th dan');
            });

                <div class="space-y-6">
                    <!-- Section 1: Testing & Promotion Policy -->
                    <div class="p-4 rounded-lg bg-neutral-900/90 border border-neutral-800 text-xs sm:text-sm text-neutral-300">

                        <p class="leading-relaxed">Instructor ranks and Dan advancements can be achieved through testing or awarded at the discretion and recognition of other instructors. The material outlined below represents <strong>recommended test material</strong> for instructors who choose to test.</p>

                                    </div>
                                `;
                            }).join('')}

                    </div>

                    <!-- Section 3: General Requirements & Information (Nidan through Kudan) -->
                    <div>
                        <h4 class="font-bold text-white uppercase tracking-wider text-xs mb-3 flex items-center text-accent">
                            <i class="fas fa-circle-info mr-2"></i>General Requirements & Information (Nidan through Kudan)
                        </h4>
                        <div class="space-y-3">
                            ${danRanksGeneral.map(col => {
                                const generalInfoReqs = {};
                                if (col.reqs.info && col.reqs.info.length > 0) generalInfoReqs.info = col.reqs.info;
                                if (col.reqs.general && col.reqs.general.length > 0) generalInfoReqs.general = col.reqs.general;

                                return `
                                    <div class="border border-neutral-800 rounded-md p-4 bg-neutral-950">
                                        <h5 class="text-sm font-bold text-white mb-2 flex items-center justify-between">
                                            <span>${col.rank} ${col.level ? `(${col.level})` : ''}</span>
                                            <span class="text-xs font-normal text-neutral-400">${col.color || ''}</span>
                                        </h5>
                                        ${buildRequirementsList(generalInfoReqs, false)}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;

            return `
                <div class="bg-neutral-900 border border-neutral-800 rounded-lg overflow-hidden transition-all duration-200 hover:border-neutral-700">
                    <button onclick="toggleReqs('dan-ranks-combined')" class="w-full text-left px-4 py-3 flex items-center justify-between hover:bg-neutral-800 focus:outline-none group">
                        <div class="flex items-center">
                            <div class="w-8 h-8 rounded border border-neutral-600 mr-4 shadow-inner shrink-0 bg-black text-white flex items-center justify-center font-bold text-xs">DAN</div>
                            <span class="font-bold uppercase tracking-wider text-sm sm:text-base text-neutral-300 group-hover:text-white">Dan Ranks (2nd Dan to 9th Dan)</span>
                        </div>
                        <i id="icon-dan-ranks-combined" class="fas fa-chevron-down text-neutral-500 transition-transform duration-200 ml-2"></i>
                    </button>
                    
                    <div id="reqs-dan-ranks-combined" class="hidden bg-black p-6 border-t border-neutral-800">
                        ${innerHtml}
                    </div>
                </div>
            `;
        }

        function renderAllSections() {
            const container = document.getElementById('curriculum-container');

            const colNovice = parsedZmaCols.find(c => c.rank.includes('10th') && !c.rank.includes('High')) || { rank: "10th Kyū", level: "Novice", color: "White", reqs: { info: ["Default rank for new members of the class."], general: ["Participated in a couple of classes."] } };
            const colYellow = parsedZmaCols.find(c => c.rank.includes('9th') && !c.rank.includes('High')) || { rank: "9th Kyū", level: "Beginner I", color: "Yellow", reqs: {} };
            const colOrange = parsedZmaCols.find(c => c.rank.includes('8th') && !c.rank.includes('High')) || { rank: "8th Kyū", level: "Beginner II", color: "Orange", reqs: {} };
            const colBlue = parsedZmaCols.find(c => c.rank.includes('7th') && !c.rank.includes('High')) || { rank: "7th Kyū", level: "Intermediate I", color: "Blue", reqs: {} };
            const colPurple = parsedZmaCols.find(c => c.rank.includes('6th') && !c.rank.includes('High')) || { rank: "6th Kyū", level: "Intermediate II", color: "Purple", reqs: {} };
            const colGreen1 = parsedZmaCols.find(c => c.rank.includes('5th')) || { rank: "5th Kyū", level: "Advanced I", color: "Green", reqs: {} };
            const colGreen2 = parsedZmaCols.find(c => c.rank.includes('4th')) || { rank: "4th Kyū", level: "Advanced II", color: "Green (2 stripes)", reqs: {} };
            
            const colBrown1 = parsedZmaCols.find(c => c.rank.includes('3rd') && c.level.includes('Teaching')) || { rank: "3rd Kyū", level: "Teaching Assistant I", color: "Brown", reqs: {} };
            const colBrown2 = parsedZmaCols.find(c => c.rank.includes('2nd') && c.level.includes('Teaching')) || { rank: "2nd Kyū", level: "Teaching Assistant II", color: "Brown", reqs: {} };
            const colBrown3 = parsedZmaCols.find(c => c.rank.includes('1st') && c.level.includes('Teaching')) || { rank: "1st Kyū", level: "Teaching Assistant III", color: "Brown", reqs: {} };
            const colShodan = parsedZmaCols.find(c => c.rank.includes('Shodan') || c.rank.includes('1st Dan')) || { rank: "Shodan (1st Dan)", level: "Instructor I", color: "Black", reqs: {} };

            // 1. Student Belts (White -> 4th Kyū)
            let studentBeltsHtml = '';
            let studentTitle = "Student Curriculum (10th to 4th Kyū)";

            if (activeStudentTab === 'standard') {
                const stdList = [
                    { id: "white", name: `White Belt (${colNovice.rank})`, colorClass: getBeltColorClass(colNovice.color, colNovice.rank), reqs: colNovice.reqs },
                    { id: "yellow", name: `Yellow Belt (${colYellow.rank})`, colorClass: getBeltColorClass(colYellow.color, colYellow.rank), reqs: colYellow.reqs },
                    { id: "orange", name: `Orange Belt (${colOrange.rank})`, colorClass: getBeltColorClass(colOrange.color, colOrange.rank), reqs: colOrange.reqs },
                    { id: "blue", name: `Blue Belt (${colBlue.rank})`, colorClass: getBeltColorClass(colBlue.color, colBlue.rank), reqs: colBlue.reqs },
                    { id: "purple", name: `Purple Belt (${colPurple.rank})`, colorClass: getBeltColorClass(colPurple.color, colPurple.rank), reqs: colPurple.reqs },
                    { id: "green", name: `Green Belt (${colGreen1.rank})`, colorClass: getBeltColorClass(colGreen1.color, colGreen1.rank), reqs: colGreen1.reqs },
                    { id: "green2", name: `2nd-degree Green Belt (${colGreen2.rank})`, colorClass: getBeltColorClass(colGreen2.color, colGreen2.rank), reqs: colGreen2.reqs }
                ];
                studentBeltsHtml = stdList.map(b => renderAccordion(b.id, b.name, b.colorClass, b.reqs)).join('');

            } else if (activeStudentTab === 'junior') {
                studentTitle = "Junior Belt System (White to 4th Kyū)";
                const jrList = parsedJrCols.map(c => ({
                    id: `jr-${c.rank.toLowerCase().replace(/[^a-z0-9]/g, '-')}`,
                    name: `${c.color} (${c.rank})`,
                    colorClass: getBeltColorClass(c.color, c.rank),
                    reqs: c.reqs
                }));

                jrList.push(
                    { id: "jr-green1", name: `Green Belt (${colGreen1.rank})`, colorClass: getBeltColorClass(colGreen1.color, colGreen1.rank), reqs: colGreen1.reqs },
                    { id: "jr-green2", name: `2nd-degree Green Belt (${colGreen2.rank})`, colorClass: getBeltColorClass(colGreen2.color, colGreen2.rank), reqs: colGreen2.reqs }
                );

                studentBeltsHtml = jrList.map(b => renderAccordion(b.id, b.name, b.colorClass, b.reqs)).join('');

            } else if (activeStudentTab === 'milestone') {
                studentTitle = "Milestone / Honorary System (White to 4th Kyū)";
                const milestoneList = [
                    { id: "m-white", name: `White Belt (${colNovice.rank})`, colorClass: getBeltColorClass(colNovice.color, colNovice.rank), reqs: colNovice.reqs },
                    { 
                        id: "m-gray-begin", 
                        name: "Shokyū / Beginner Gray Belt", 
                        colorClass: "bg-[#acacac] text-black bg-[linear-gradient(90deg,transparent_45%,white_45%,white_55%,transparent_55%)]", 
                        reqs: mergeRequirements(
                            { info: ["Condenses yellow and orange belt curricula into a single beginner milestone rank.", "Proficient in all fundamentals of Yellow and Orange belts."] },
                            colYellow.reqs, 
                            colOrange.reqs
                        ) 
                    },
                    { 
                        id: "m-gray-inter", 
                        name: "Chūkyū / Intermediate Gray Belt", 
                        colorClass: "bg-[#929292] text-black", 
                        reqs: mergeRequirements(
                            { info: ["Condenses blue and purple belt curricula into a single intermediate milestone rank.", "Proficient in all fundamentals of Blue and Purple belts."] },
                            colBlue.reqs, 
                            colPurple.reqs
                        ) 
                    },
                    { 
                        id: "m-gray-adv", 
                        name: "Jōkyū / Advanced Gray Belt", 
                        colorClass: "bg-[#7a7a7a] text-black bg-[linear-gradient(90deg,transparent_45%,black_45%,black_55%,transparent_55%)]", 
                        reqs: mergeRequirements(
                            { info: ["Condenses both 1st and 2nd degree green belts into a single advanced milestone rank.", "Prepares the student for the instructor ranks beginning at 3rd Kyū."] },
                            colGreen1.reqs, 
                            colGreen2.reqs
                        ) 
                    }
                ];
                studentBeltsHtml = milestoneList.map(b => renderAccordion(b.id, b.name, b.colorClass, b.reqs)).join('');
            }

            // Append Electives & Verticals dropdown directly underneath 4th Kyū
            studentBeltsHtml += renderElectivesAccordion();

            // 2. Instructor Ranks in sequence
            const instructorRankElements = [
                renderAccordion('brown', `Brown Belt (${colBrown1.rank})`, getBeltColorClass(colBrown1.color, colBrown1.rank), colBrown1.reqs),
                renderAccordion('brown2', `2nd-degree Brown Belt (${colBrown2.rank})`, getBeltColorClass(colBrown2.color, colBrown2.rank), colBrown2.reqs),
                renderAccordion('brown3', `3rd-degree Brown Belt (${colBrown3.rank})`, getBeltColorClass(colBrown3.color, colBrown3.rank), colBrown3.reqs),
                renderAccordion('black', `Black Belt (${colShodan.rank})`, getBeltColorClass(colShodan.color, colShodan.rank), colShodan.reqs),
                renderAccordion('shidoin', 'Shidoin (指導員) Title / Instructorship', 'bg-[#2e2e2e] text-white', {
                    info: [
                        "The character \"Shi\" (指) means \"to point\" or \"indicate\", and \"Do\" (導) means \"to lead\" or \"guide\", descriptive of instructors.",
                        "An instructor is a black belt who actively teaches and participates in classes.",
                        "Students and instructors may honor an instructor by calling them \"Master (Name)\", similar to \"Sensei\" in Japanese systems."
                    ]
                }),
                renderDanRanksCombinedAccordion(parsedZmaCols),
                renderAccordion('renshi', 'Renshi (錬士) Title / "Polished Expert"', 'bg-[#ffb3b3] text-black', {
                    info: [
                        "\"Ren\" (錬) implies \"polished\" or \"refined\", while \"Shi\" (士) translates to \"person\" / expert.",
                        "Masters with the Renshi title may wear a decorative red and black paneled belt to events.",
                        "The title is a formal suffix: \"(Name), Renshi\"."
                    ],
                    general: [
                        "Has a student that is an instructor",
                        "Minimum 5+ years of active instructorship",
                        "Recognized by a kyoshi or lineage holder",
                        "Can be awarded to masters at 4th Dan and above"
                    ]
                }),
                renderAccordion('kyoshi', 'Kyoshi (教士) Title / "Experienced Teacher"', 'bg-[#ff8e8e] text-black', {
                    info: [
                        "\"Kyo\" (教) means \"teach\" or \"education\" (\"teaching expert\").",
                        "Masters with the Kyoshi title may wear a decorative red and white paneled belt to events.",
                        "The title is a formal suffix: \"(Name), Kyoshi\"."
                    ],
                    general: [
                        "Has 3+ students that are instructors",
                        "Minimum 10+ years of active instructorship",
                        "Recognized by a hanshi or lineage holder",
                        "Can be awarded to masters at 5th Dan and above"
                    ]
                }),
                renderAccordion('hanshi', 'Hanshi (範士) Title / "Model Expert" / Grandmaster', 'bg-[#ff5151] text-black', {
                    info: [
                        "\"Han\" (範) denotes \"model\" or \"example\" (\"model expert\").",
                        "Masters with the Hanshi title may wear a decorative red belt to events.",
                        "Formal title written as \"(Name), Hanshi\", often addressed as Grandmaster."
                    ],
                    general: [
                        "Has a student that holds the renshi title",
                        "Minimum 20+ years of active instructorship",
                        "Awarded by popular vote or lineage holder",
                        "Can be awarded to masters at 7th Dan and above"
                    ]
                })
            ];

            // 3. Visitors Section
            const visitorElements = [
                renderAccordion('visitor', 'Visitor', 'bg-white text-black', {
                    info: [
                        "Zen Martial Arts openly accepts visitors from other martial arts systems.",
                        "Visitors are welcome to wear their home school uniform as long as it is respectful and safe.",
                        "Visitors are encouraged to participate and progress in the ZMA system if desired; instructors may offer worn symbolism to honor external accomplishments."
                    ]
                }),
                renderAccordion('visiting-instructor', 'Visiting Instructor', 'bg-[#2e2e2e] text-white', {
                    info: [
                        "Visiting martial artists who are instructors or masters in their respective disciplines are recognized as Visiting Instructors.",
                        "Honored formally during class as \"Mr./Mrs./Ms. (Name)\".",
                        "Often invited to lead seminars and workshops in their areas of specialization."
                    ]
                })
            ];

            let html = `
                <!-- Student Section -->
                <section class="mb-12">
                    <h2 class="text-2xl font-bold text-white uppercase border-b border-neutral-800 pb-2 mb-6 flex items-center justify-between">
                        <span>${studentTitle}</span>
                        <span class="text-xs tracking-widest text-accent border border-accent/40 px-2.5 py-0.5 rounded">White – 4th Kyū</span>
                    </h2>
                    <div class="space-y-3">
                        ${studentBeltsHtml}
                    </div>
                </section>

                <!-- Instructor Ranks Section -->
                <section class="mb-12">
                    <h2 class="text-2xl font-bold text-white uppercase border-b border-neutral-800 pb-2 mb-2 flex items-center justify-between">
                        <span>Instructor Ranks</span>
                        <span class="text-xs tracking-widest text-amber-400 border border-amber-400/40 px-2.5 py-0.5 rounded">3rd Kyū – Dan Ranks & Titles</span>
                    </h2>
                    <p class="text-neutral-400 text-xs sm:text-sm mb-6">Assistant instructorship, first-degree black belt certification, dan rank test material, and teaching titles.</p>
                    <div class="space-y-3">
                        ${instructorRankElements.join('')}
                    </div>
                </section>

                <!-- Visitors Section -->
                <section class="mb-12">
                    <h2 class="text-2xl font-bold text-white uppercase border-b border-neutral-800 pb-2 mb-6">Visitors</h2>
                    <div class="space-y-3">
                        ${visitorElements.join('')}
                    </div>
                </section>
            `;

            container.innerHTML = html;
        }

        function buildRequirementsList(reqs, isRecommended = false) {
            if (!reqs || Object.keys(reqs).length === 0) {
                return '<p class="text-neutral-500 italic text-sm">No specific requirements listed.</p>';
            }

            let html = '<div class="space-y-5">';
            let hasContent = false;

            for (const [key, items] of Object.entries(reqs)) {
                if (items && items.length > 0) {
                    hasContent = true;
                    let labelName = labels[key] || key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
                    if (isRecommended && key !== 'info' && key !== 'general') {
                        labelName = `Recommended ${labelName} Material`;
                    }

                    html += `
                        <div>
                            <h4 class="text-accent font-bold uppercase tracking-wider text-xs mb-2 flex items-center">
                                <i class="fas fa-caret-right mr-2"></i>${labelName}
                            </h4>
                            <ul class="list-disc list-inside text-neutral-400 space-y-1 ml-2 text-sm md:text-base">
                    `;
                    items.forEach(item => {
                        const style = key === 'info' ? 'italic text-neutral-300' : '';
                        html += `<li class="${style}">${item}</li>`;
                    });
                    html += `</ul></div>`;
                }
            }

            html += '</div>';
            return hasContent ? html : '<p class="text-neutral-500 italic text-sm">No specific requirements listed.</p>';
        }

        function toggleReqs(id) {
            const reqContainer = document.getElementById(`reqs-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (!reqContainer) return;
            
            if (reqContainer.classList.contains('hidden')) {
                reqContainer.classList.remove('hidden');
                if (icon) icon.style.transform = 'rotate(180deg)';
            } else {
                reqContainer.classList.add('hidden');
                if (icon) icon.style.transform = 'rotate(0deg)';
            }
        }

        document.addEventListener('DOMContentLoaded', initCurriculum);
    </script>
</body>
</html>
