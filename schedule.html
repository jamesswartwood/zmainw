<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZMAINW - Class Schedule</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260827_1">
</head>
<body class="flex flex-col h-screen overflow-hidden bg-[#111] text-[#eee]">

    <!-- Top Navigation Bar -->
    <header class="h-16 flex items-center justify-between px-4 lg:px-6 bg-black border-b border-neutral-800 shrink-0 z-50 relative">
        <div class="flex items-center cursor-pointer" onclick="window.location.href='index.html'">
            <span class="font-bold text-2xl tracking-wider text-white">ZMA<span class="text-accent">INW</span></span>
            <span class="ml-4 pl-4 border-l border-neutral-700 text-sm uppercase tracking-widest text-neutral-400 hidden sm:inline-block">Schedule</span>
        </div>
        <div>
            <button onclick="window.location.href='index.html'" class="text-neutral-400 hover:text-white transition-colors text-sm font-bold uppercase tracking-wide flex items-center">
                <i class="fas fa-arrow-left mr-2"></i> Back to Main
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 lg:p-12 pb-20 scroll-smooth fade-in">
        <div class="max-w-4xl mx-auto">
            
            <div class="border-b border-neutral-800 pb-4 mb-6">
                <h1 class="text-3xl sm:text-4xl font-bold text-white uppercase tracking-wide">Upcoming Classes</h1>
                <p class="text-neutral-400 text-xs sm:text-sm mt-1">Showing upcoming classes. Click any class to view detailed notes.</p>
            </div>

            <!-- Day of Week Filter Bar -->
            <div id="filter-container" class="flex flex-wrap items-center gap-2 mb-6 hidden">
                <span class="text-xs font-semibold uppercase tracking-wider text-neutral-400 mr-1"><i class="fas fa-filter mr-1.5"></i>Filter Day:</span>
                <div id="day-buttons" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Schedule Container -->
            <div id="schedule-container" class="space-y-3">
                <div class="flex items-center justify-center py-16 text-neutral-500">
                    <i class="fas fa-circle-notch fa-spin text-2xl mr-3 text-accent"></i>
                    <span>Loading upcoming schedule...</span>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        let allUpcomingClasses = [];
        let selectedDayFilter = 'ALL';

        const DAYS_OF_WEEK = [
            'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'
        ];

        function getAuthCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            return null;
        }

        // Redirect back to home if accessed directly without authenticating
        if (getAuthCookie('zma_authenticated') !== 'true') {
            const passwordAttempt = prompt("Please enter the password to view this page:");
            if (passwordAttempt === "humblewarrior") {
                const expires = new Date(Date.now() + 30 * 864e5).toUTCString();
                document.cookie = `zma_authenticated=true; expires=${expires}; path=/; SameSite=Lax`;
            } else {
                alert("Access denied.");
                window.location.href = "index.html";
            }
        }

        const SHEET_ID = '1kNjWglka89LPcv4jOI7HbiCQx-44d2d0cTLTgMZAZQY';

        function fetchSheetDataJSONP(tabName) {
            return new Promise((resolve) => {
                const callbackName = 'gvizCallback_' + Math.random().toString(36).substring(2, 9);
                const script = document.createElement('script');
                
                window[callbackName] = function(response) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    if (response && response.table && response.table.rows) {
                        resolve(response.table.rows);
                    } else {
                        resolve([]);
                    }
                };

                script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${encodeURIComponent(tabName)}`;
                script.onerror = function() {
                    delete window[callbackName];
                    if (script.parentNode) document.body.removeChild(script);
                    resolve([]);
                };

                document.body.appendChild(script);
            });
        }

        function parseRowDate(rawVal) {
            if (!rawVal) return null;
            
            if (typeof rawVal === 'string' && rawVal.startsWith('Date(')) {
                const parts = rawVal.match(/\d+/g);
                if (parts && parts.length >= 3) {
                    return new Date(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
                }
            }

            const cleanStr = String(rawVal).replace(/\s*\(.*?\)/, '').trim();
            const parsed = new Date(cleanStr);
            return isNaN(parsed.getTime()) ? null : parsed;
        }

        function getTopicBadgeStyle(topic) {
            const norm = (topic || '').trim().toLowerCase();
            
            // Royal Blue: Judo & Jujitsu, Wing Chun, Forms, Strikes & Kicks, Sticks & Weapons
            if (['judo & jujitsu', 'wing chun', 'forms', 'strikes & kicks', 'sticks & weapons'].includes(norm)) {
                return 'bg-[#0052cc] text-white border-[#004099] font-medium';
            }
            
            // Forest Green: Sparring, Grappling, Sparring & Grappling, Weapons Sparring
            if (['sparring', 'grappling', 'sparring & grappling', 'weapons sparring'].includes(norm)) {
                return 'bg-[#00703c] text-white border-[#00552d] font-medium';
            }

            // Warm Brown: Open Practice, Test Preparation
            if (['open practice', 'test preparation'].includes(norm)) {
                return 'bg-[#533924] text-[#ffdcb3] border-[#3f2b1b] font-medium';
            }

            // Bright Crimson: Belt Test
            if (norm === 'belt test') {
                return 'bg-[#b30006] text-white border-[#8a0005] font-semibold';
            }

            // Deep Purple: Drills Night, Weapons Night, Night of a Thousand Kicks
            if (['drills night', 'weapons night', 'night of a thousand kicks'].includes(norm)) {
                return 'bg-[#5c2d82] text-white border-[#472265] font-medium';
            }

            // Dark Charcoal: Seminar, Black Belt Test
            if (['seminar', 'black belt test'].includes(norm)) {
                return 'bg-[#333333] text-white border-[#222222] font-medium';
            }

            // Muted Gray: No Class
            if (norm === 'no class') {
                return 'bg-[#6b7280] text-white border-[#4b5563] font-medium';
            }

            // Deep Teal: Other, To Be Determined
            if (['other', 'to be determined'].includes(norm)) {
                return 'bg-[#1b5e6b] text-white border-[#13444e] font-medium';
            }

            return 'bg-neutral-800 text-neutral-300 border-neutral-700';
        }

        async function loadUpcomingSchedule() {
            const container = document.getElementById('schedule-container');
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            const currentYear = today.getFullYear();
            const currentTab = `${currentYear} Classes`;
            const nextTab = `${currentYear + 1} Classes`;

            try {
                let rows = await fetchSheetDataJSONP(currentTab);

                if (today.getMonth() >= 9 || rows.length === 0) {
                    const nextYearRows = await fetchSheetDataJSONP(nextTab);
                    rows = rows.concat(nextYearRows);
                }

                if (!rows || rows.length === 0) {
                    container.innerHTML = `
                        <div class="bg-neutral-900 border border-neutral-800 p-8 rounded-lg text-center">
                            <p class="text-neutral-400">No classes found in the schedule.</p>
                        </div>`;
                    return;
                }

                const parsedClasses = [];

                rows.forEach((row, idx) => {
                    const dateRaw = row.c && row.c[0] ? (row.c[0].f || row.c[0].v || '') : '';
                    const timeVal = row.c && row.c[1] ? (row.c[1].f || row.c[1].v || '') : '';
                    const topicVal = row.c && row.c[2] ? (row.c[2].f || row.c[2].v || '') : '';
                    const notesVal = row.c && row.c[3] ? (row.c[3].f || row.c[3].v || '') : '';

                    // Exclude rows without any content in "Class Topic"
                    if (!topicVal || !topicVal.toString().trim()) return;

                    const dateObj = parseRowDate(dateRaw);
                    const dayName = dateObj ? DAYS_OF_WEEK[dateObj.getDay()] : null;

                    parsedClasses.push({
                        id: `class-${idx}`,
                        dateStr: dateRaw,
                        dateObj: dateObj,
                        dayOfWeek: dayName,
                        time: timeVal,
                        topic: topicVal.toString().trim(),
                        notes: notesVal
                    });
                });

                // Future classes only
                let upcoming = parsedClasses.filter(c => c.dateObj && c.dateObj >= today);

                if (upcoming.length === 0) {
                    upcoming = parsedClasses;
                }

                upcoming.sort((a, b) => (a.dateObj && b.dateObj ? a.dateObj - b.dateObj : 0));
                allUpcomingClasses = upcoming;

                setupDayFilters(allUpcomingClasses);
                applyFilterAndRender();

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-lg text-center">
                        <p class="text-accent mb-2 font-bold"><i class="fas fa-exclamation-triangle mr-2"></i>Unable to load schedule data</p>
                        <p class="text-neutral-500 text-sm">Please verify spreadsheet sharing permissions.</p>
                    </div>`;
            }
        }

        function setupDayFilters(classes) {
            const filterContainer = document.getElementById('filter-container');
            const dayButtonsContainer = document.getElementById('day-buttons');

            // Find unique days present in the active schedule
            const activeDayIndexes = new Set();
            classes.forEach(c => {
                if (c.dateObj) activeDayIndexes.add(c.dateObj.getDay());
            });

            if (activeDayIndexes.size <= 1) {
                filterContainer.classList.add('hidden');
                return;
            }

            filterContainer.classList.remove('hidden');
            let buttonsHtml = `
                <button onclick="setDayFilter('ALL')" id="btn-filter-ALL" class="px-3 py-1 text-xs font-semibold rounded-full border transition-colors bg-white text-black border-white">
                    All
                </button>
            `;

            // Sort standard Sun-Sat order
            const sortedDays = Array.from(activeDayIndexes).sort((a, b) => a - b);
            sortedDays.forEach(dayIdx => {
                const dayName = DAYS_OF_WEEK[dayIdx];
                buttonsHtml += `
                    <button onclick="setDayFilter('${dayName}')" id="btn-filter-${dayName}" class="px-3 py-1 text-xs font-semibold rounded-full border border-neutral-700 bg-neutral-900 text-neutral-300 hover:border-neutral-500 transition-colors">
                        ${dayName}s
                    </button>
                `;
            });

            dayButtonsContainer.innerHTML = buttonsHtml;
        }

        function setDayFilter(day) {
            selectedDayFilter = day;

            // Update active pill button styling
            const buttons = document.querySelectorAll('#day-buttons button');
            buttons.forEach(btn => {
                btn.className = 'px-3 py-1 text-xs font-semibold rounded-full border border-neutral-700 bg-neutral-900 text-neutral-300 hover:border-neutral-500 transition-colors';
            });

            const activeBtn = document.getElementById(`btn-filter-${day}`);
            if (activeBtn) {
                activeBtn.className = 'px-3 py-1 text-xs font-semibold rounded-full border transition-colors bg-white text-black border-white';
            }

            applyFilterAndRender();
        }

        function applyFilterAndRender() {
            let filtered = allUpcomingClasses;
            if (selectedDayFilter !== 'ALL') {
                filtered = allUpcomingClasses.filter(c => c.dayOfWeek === selectedDayFilter);
            }
            renderScheduleList(filtered);
        }

        function renderScheduleList(classes) {
            const container = document.getElementById('schedule-container');
            
            if (classes.length === 0) {
                container.innerHTML = '<p class="text-neutral-500 italic text-center py-8">No upcoming classes scheduled for this selection.</p>';
                return;
            }

            let html = '';

            classes.forEach(item => {
                const badgeClasses = getTopicBadgeStyle(item.topic);
                const isBeltTest = /belt test/i.test(item.topic);
                const hasNotes = item.notes && item.notes.trim().length > 0;

                html += `
                    <div class="bg-neutral-900 border border-neutral-800 rounded-lg overflow-hidden transition-all duration-200 hover:border-neutral-700">
                        <button onclick="toggleNotes('${item.id}')" class="w-full text-left p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 hover:bg-neutral-800/60 focus:outline-none group">
                            
                            <div class="flex items-center space-x-4">
                                <div class="w-2.5 h-2.5 rounded-full ${isBeltTest ? 'bg-red-600 shadow-[0_0_8px_#dc2626]' : 'bg-neutral-600'}"></div>
                                <div>
                                    <span class="font-bold text-base text-white group-hover:text-accent transition-colors">${item.dateStr}</span>
                                    ${item.time ? `<span class="text-xs font-mono text-neutral-400 ml-2 block sm:inline">(${item.time})</span>` : ''}
                                </div>
                            </div>

                            <div class="flex items-center justify-between md:justify-end gap-3 pl-6 md:pl-0">
                                <span class="px-3 py-1 rounded-full text-xs tracking-wider uppercase border shadow-sm ${badgeClasses}">
                                    ${item.topic}
                                </span>
                                
                                <div class="flex items-center text-neutral-500 text-xs gap-1 ml-2">
                                    ${hasNotes ? '<i class="fas fa-sticky-note text-amber-500/80 mr-1" title="Notes Available"></i>' : ''}
                                    <i id="icon-${item.id}" class="fas fa-chevron-down text-neutral-500 transition-transform duration-200"></i>
                                </div>
                            </div>
                        </button>
                        
                        <div id="notes-${item.id}" class="hidden bg-black p-5 border-t border-neutral-800 text-sm">
                            <h4 class="text-accent font-bold uppercase tracking-wider text-xs mb-2">
                                <i class="fas fa-info-circle mr-1.5"></i>Class Details & Notes
                            </h4>
                            <p class="text-neutral-300 leading-relaxed">${hasNotes ? item.notes : '<span class="italic text-neutral-500">No additional notes for this class.</span>'}</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function toggleNotes(id) {
            const container = document.getElementById(`notes-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                container.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        document.addEventListener('DOMContentLoaded', loadUpcomingSchedule);
    </script>
</body>
</html>
