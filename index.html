                if (link.type === 'protected') {
                    desktopHTML += `
                        <button onclick="handleProtectedNavigation('${link.target}')" class="text-neutral-400 hover:text-white transition-colors flex items-center whitespace-nowrap">
                            <i class="fas ${link.icon} mr-1 text-xs"></i> ${link.label.toUpperCase()}
                        </button>`;
                    
                    mobileHTML += `
                        <button onclick="handleProtectedNavigation('${link.target}'); toggleMobileMenu();" class="text-left px-6 py-4 border-b border-neutral-800 text-neutral-400 hover:text-white hover:bg-neutral-900 uppercase font-bold text-sm tracking-wide flex items-center">
                            <i class="fas ${link.icon} w-6 mr-2"></i> ${link.label}
                        </button>`;
                } else {
                    desktopHTML += `
                        <a href="${link.url}" target="_blank" class="text-neutral-400 hover:text-white transition-colors flex items-center whitespace-nowrap">
                            <i class="fas ${link.icon} mr-1 text-xs"></i> ${link.label}
                        </a>`;
                    
                    mobileHTML += `
                        <a href="${link.url}" target="_blank" onclick="toggleMobileMenu();" class="text-left px-6 py-4 border-b border-neutral-800 text-neutral-400 hover:text-white hover:bg-neutral-900 uppercase font-bold text-sm tracking-wide flex items-center">
                            <i class="fas ${link.icon} w-6 mr-2"></i> ${link.label}
                        </a>`;
                }
            });

            if (desktopContainer) desktopContainer.innerHTML = desktopHTML;
            if (mobileContainer) mobileContainer.innerHTML = mobileHTML;
        }

        function navigateTo(viewName) {
            const mainContent = document.getElementById('main-content');
            
            mainContent.style.opacity = '0';
            
            setTimeout(() => {
                mainContent.scrollTo({ top: 0, behavior: 'instant' });
                mainContent.innerHTML = views[viewName] || views['home'];
                mainContent.style.opacity = '1';
                updateActiveNav(viewName);
            }, 150);
        }

        function updateActiveNav(viewName) {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
            });
            
            if(viewName === 'contact') return;

            const desktopNav = document.getElementById(`nav-desktop-${viewName}`);
            const mobileNav = document.getElementById(`nav-mobile-${viewName}`);
            
            if(desktopNav) desktopNav.classList.add('active');
            if(mobileNav) mobileNav.classList.add('active');
        }

        function handleProtectedNavigation(target) {
            const passwordAttempt = prompt("Please enter the password to view this document:");
            if (passwordAttempt === "humblewarrior") {
                if (target === 'schedule') {
                    window.open("https://docs.google.com/spreadsheets/d/1kNjWglka89LPcv4jOI7HbiCQx-44d2d0cTLTgMZAZQY/edit?usp=drive_link", "_blank");
                } else if (target === 'curriculum') {
                    window.location.href = "curriculum.html";
                }
            } else if (passwordAttempt !== null) {
                alert("Incorrect password. Access denied.");
            }
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        document.getElementById('mobile-menu-btn').addEventListener('click', toggleMobileMenu);

        document.addEventListener('DOMContentLoaded', () => {
            renderExternalLinks();
            navigateTo('home');
        });
    </script>
</body>
</html>
